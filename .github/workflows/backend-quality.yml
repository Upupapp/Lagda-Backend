# LAGDA backend quality gates (BACKEND-01).
#
# Every step here is a hard gate. There is no `continue-on-error` and there are
# no soft warnings: a failure fails the run.
#
# The lint step is also the ARCHITECTURE gate. The package-boundary rules from
# BACKEND-00 are implemented as ESLint import restrictions, so a layer reaching
# for infrastructure it may not depend on fails CI here (INV-001, INV-005,
# INV-007). It must not be skipped or made advisory.
#
# This workflow needs NO secrets, NO database and NO cloud account. Foundation
# checks stay fast and deterministic; database-backed CI arrives with the
# database, in a later command.

name: Backend Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 is the runtime decision in ADR-001. Deliberately a single
          # version rather than a matrix: testing older majors would undermine
          # the runtime boundary the engines field declares.
          node-version: 24
          cache: npm

      # Lockfile-respecting install. Fails if package.json and the lockfile
      # disagree, which is the point.
      - name: Install
        run: npm ci

      # ONE definition of the gate, not two.
      #
      # This used to list Typecheck / OpenAPI / Lint / Test / Build as separate
      # steps, and `npm run verify` did not exist — so "clean locally" and
      # "clean in CI" were different claims. A directory-scoped lint passed
      # while `eslint .` failed here, and the OpenAPI currency check had no
      # local equivalent at ALL, which is how the committed document once went
      # four route-changing commits stale with nothing failing.
      #
      # Every CHECK now lives in `npm run verify`, so adding one to the gate is
      # a package.json change that developers get automatically. Only CI-ONLY
      # concerns — caching, artifact upload, the notes below — stay here.
      #
      # npm prints each sub-script as it starts (`> @lagda/backend@0.0.0 lint`),
      # so a failure is still attributable to a step in the log.
      - name: Verify (typecheck, openapi, lint, test, build)
        run: npm run verify

      # NOT CHECKED HERE, deliberately stated rather than implied: the LAGDA
      # frontend does not compile against @lagda/contracts. The strongest reason
      # to share a contracts package is that changing a contract fails CI when
      # the other consumer stops compiling — and with two repositories and no
      # shared CI, that guardrail does not exist. Tracked as OD-005 / OD-011.
      - name: Contract drift limitation
        run: |
          echo "Backend compiles against @lagda/contracts. The frontend does not."
          echo "Cross-repository contract CI is NOT established. See OD-005, OD-011."

  database:
    name: Migrations and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Pinned major, matching local development. `postgres:latest` would make CI
    # results depend on when the workflow happened to run.
    services:
      postgres:
        image: postgres:16
        env:
          # Ephemeral, CI-only, and disposable. Never a staging or production
          # credential — this database exists for the length of one job.
          POSTGRES_USER: lagda_ci
          POSTGRES_PASSWORD: lagda_ci
          POSTGRES_DB: lagda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lagda_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://lagda_ci:lagda_ci@localhost:5432/lagda_test
      DATABASE_TEST_URL: postgresql://lagda_ci:lagda_ci@localhost:5432/lagda_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Same rule as the quality job: ONE definition. `verify:db` is the
      # database gate, and it is reproducible locally against any PostgreSQL
      # by exporting DATABASE_URL and DATABASE_TEST_URL.
      #
      # It proves an EMPTY database reaches the current schema (incremental
      # migration against an accumulated developer database proves nothing
      # about a fresh environment), that re-running the deployment step is a
      # no-op, and then runs the transaction, constraint, mapping AND workspace
      # tenancy suites against real PostgreSQL. The tenancy suites connect as
      # the RUNTIME role, not the owner: an owner bypasses RLS unless forced,
      # so a suite connecting as the superuser would pass while production
      # leaked. Migration 048 is what happens when that distinction is missed.
      - name: Verify database (migrate from zero, idempotency, integration)
        run: npm run verify:db
