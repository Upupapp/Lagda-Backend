# LAGDA backend quality gates (BACKEND-01).
#
# Every step here is a hard gate. There is no `continue-on-error` and there are
# no soft warnings: a failure fails the run.
#
# The lint step is also the ARCHITECTURE gate. The package-boundary rules from
# BACKEND-00 are implemented as ESLint import restrictions, so a layer reaching
# for infrastructure it may not depend on fails CI here (INV-001, INV-005,
# INV-007). It must not be skipped or made advisory.
#
# This workflow needs NO secrets, NO database and NO cloud account. Foundation
# checks stay fast and deterministic; database-backed CI arrives with the
# database, in a later command.

name: Backend Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 is the runtime decision in ADR-001. Deliberately a single
          # version rather than a matrix: testing older majors would undermine
          # the runtime boundary the engines field declares.
          node-version: 24
          cache: npm

      # Lockfile-respecting install. Fails if package.json and the lockfile
      # disagree, which is the point.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Architecture gate. See the note at the top of this file.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # NOT CHECKED HERE, deliberately stated rather than implied: the LAGDA
      # frontend does not compile against @lagda/contracts. The strongest reason
      # to share a contracts package is that changing a contract fails CI when
      # the other consumer stops compiling — and with two repositories and no
      # shared CI, that guardrail does not exist. Tracked as OD-005 / OD-011.
      - name: Contract drift limitation
        run: |
          echo "Backend compiles against @lagda/contracts. The frontend does not."
          echo "Cross-repository contract CI is NOT established. See OD-005, OD-011."

  database:
    name: Migrations and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Pinned major, matching local development. `postgres:latest` would make CI
    # results depend on when the workflow happened to run.
    services:
      postgres:
        image: postgres:16
        env:
          # Ephemeral, CI-only, and disposable. Never a staging or production
          # credential — this database exists for the length of one job.
          POSTGRES_USER: lagda_ci
          POSTGRES_PASSWORD: lagda_ci
          POSTGRES_DB: lagda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lagda_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://lagda_ci:lagda_ci@localhost:5432/lagda_test
      DATABASE_TEST_URL: postgresql://lagda_ci:lagda_ci@localhost:5432/lagda_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # Proves an EMPTY database can reach the current schema. Incremental
      # migration against an accumulated developer database proves nothing about
      # a fresh environment.
      - name: Migrate from zero
        run: npm run db:migrate

      - name: Migration status
        run: npm run db:migrate:status

      # Re-running the deployment step must be a no-op.
      - name: Migrate again (idempotency)
        run: npm run db:migrate

      # Transactions, rollback, constraints, mapping AND the workspace tenancy
      # security suite — against real PostgreSQL. These cannot be faked, and the
      # tenancy tests run as the RUNTIME role: an owner bypasses RLS unless
      # forced, so a suite connecting as the superuser would pass while
      # production leaked.
      - name: PostgreSQL integration and tenancy security tests
        run: npm run test:integration
